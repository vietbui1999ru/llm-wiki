name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: "**/*.md"

  aislop:
    name: AI Slop Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: aislop Quality Gate
        uses: scanaislop/aislop@v0.10.2
